{% extends "base.html" %}

{% block title %}Create Account | FlashDeals AI{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full p-8 rounded-2xl bg-white border border-slate-200 shadow-xl shadow-slate-200/50 space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-600 to-indigo-600 flex items-center justify-center text-white mx-auto shadow-md shadow-brand-500/20">
        <i data-lucide="user-plus" class="w-6 h-6"></i>
      </div>
      <h2 class="text-2xl font-bold font-display text-slate-900 tracking-tight">Create your Account</h2>
      <p class="text-xs text-slate-500">Join thousands getting AI-optimized flash discounts</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Full Name</label>
        <input type="text" name="name" required placeholder="Jane Doe"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-500 outline-none transition-all">
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Email Address</label>
        <input type="email" name="email" required placeholder="jane@example.com"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-500 outline-none transition-all">
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-brand-500 outline-none transition-all">
      </div>

      <button type="submit" 
        class="w-full py-3 px-4 rounded-xl bg-brand-600 hover:bg-brand-700 text-white font-bold text-xs shadow-md shadow-brand-500/20 transition-all">
        Create Account & Start Shopping
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-100 text-xs text-slate-500">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="font-bold text-brand-600 hover:underline">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
