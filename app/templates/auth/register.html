{% extends "base.html" %}

{% block title %}Create Account | FlashDeals India{% endblock %}

{% block content %}
<div class="min-h-[80vh] flex items-center justify-center px-4 py-12">
  <div class="max-w-md w-full p-8 rounded-2xl bg-white border border-slate-200 shadow-xs space-y-6">
    
    <div class="text-center space-y-1.5">
      <div class="w-10 h-10 rounded-xl bg-slate-900 flex items-center justify-center text-white mx-auto shadow-xs">
        <i data-lucide="user-plus" class="w-5 h-5"></i>
      </div>
      <h2 class="text-2xl font-bold font-display text-slate-900 tracking-tight">Create your Account</h2>
      <p class="text-xs text-slate-500">Sign up to get notified of live flash drops and track your orders</p>
    </div>

    <form action="{{ url_for('auth.register') }}" method="POST" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-700 mb-1">Full Name</label>
        <input type="text" name="name" required placeholder="Aarav Sharma"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-slate-400 outline-none transition-all text-slate-900">
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Email Address</label>
        <input type="email" name="email" required placeholder="aarav.sharma@gmail.com"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-slate-400 outline-none transition-all text-slate-900">
      </div>

      <div>
        <label class="block font-semibold text-slate-700 mb-1">Password</label>
        <input type="password" name="password" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 bg-slate-50 border border-slate-200 rounded-xl focus:bg-white focus:border-slate-400 outline-none transition-all text-slate-900">
      </div>

      <button type="submit" 
        class="w-full py-3 px-4 rounded-xl bg-slate-900 hover:bg-slate-800 text-white font-bold text-xs shadow-xs transition-all">
        Create Account & Continue
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-100 text-xs text-slate-500">
      Already have an account? <a href="{{ url_for('auth.login') }}" class="font-bold text-slate-900 hover:underline">Sign in</a>
    </div>
  </div>
</div>
{% endblock %}
