{% extends "base.html" %}

{% block title %}Admin Portal Sign In | Flash Shield Command Center{% endblock %}

{% block content %}
<div class="min-h-[85vh] flex items-center justify-center px-4 py-12 bg-slate-950">
  <div class="max-w-md w-full p-8 rounded-2xl bg-dark-900 border border-slate-800 shadow-2xl space-y-6">
    
    <div class="text-center space-y-2">
      <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-brand-500 to-indigo-600 flex items-center justify-center text-white mx-auto shadow-lg shadow-brand-500/30">
        <i data-lucide="shield-check" class="w-6 h-6"></i>
      </div>
      <h2 class="text-2xl font-bold font-display text-white tracking-tight">Admin Command Center</h2>
      <p class="text-xs text-slate-400">Restricted authentication portal for telemetry & AI controls</p>
    </div>

    <!-- Demo Credential Hint -->
    <div class="p-3.5 rounded-xl bg-slate-950 border border-slate-800 text-xs text-slate-300 flex items-center justify-between">
      <div>
        <span class="font-bold text-brand-400">Admin Credentials:</span>
        <div class="font-mono text-[11px] text-slate-400">admin@idealab.com / admin123</div>
      </div>
      <button onclick="fillAdminCreds()" class="px-2.5 py-1 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 text-[10px] font-bold border border-slate-700">Auto-Fill</button>
    </div>

    <form action="{{ url_for('auth.admin_login') }}" method="POST" class="space-y-4 text-xs">
      <div>
        <label class="block font-semibold text-slate-300 mb-1">Admin Username / Email</label>
        <input type="text" name="username" id="admin-user" required placeholder="admin@idealab.com"
          class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 text-white rounded-xl focus:border-brand-500 outline-none transition-all">
      </div>

      <div>
        <label class="block font-semibold text-slate-300 mb-1">Password</label>
        <input type="password" name="password" id="admin-pwd" required placeholder="••••••••"
          class="w-full px-3.5 py-2.5 bg-slate-950 border border-slate-700 text-white rounded-xl focus:border-brand-500 outline-none transition-all">
      </div>

      <button type="submit" 
        class="w-full py-3 px-4 rounded-xl bg-gradient-to-r from-brand-600 to-indigo-600 hover:from-brand-500 hover:to-indigo-500 text-white font-bold text-xs shadow-lg shadow-brand-500/25 transition-all">
        Authenticate & Launch Console
      </button>
    </form>

    <div class="text-center pt-2 border-t border-slate-800 text-xs text-slate-500">
      <a href="{{ url_for('products.index') }}" class="text-slate-400 hover:text-white flex items-center justify-center gap-1">
        <i data-lucide="arrow-left" class="w-3.5 h-3.5"></i>
        <span>Back to Storefront</span>
      </a>
    </div>
  </div>
</div>

<script>
  function fillAdminCreds() {
    document.getElementById('admin-user').value = 'admin@idealab.com';
    document.getElementById('admin-pwd').value = 'admin123';
  }
</script>
{% endblock %}
